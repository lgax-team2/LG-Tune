name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  contracts:
    # 계약 파일·프론트 타입이 백엔드 원본과 어긋나면 실패 (pnpm gen 을 깜빡한 경우)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd backend && uv sync && uv run python scripts/gen_contracts.py
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm gen:types
      - name: 생성 파일이 커밋된 것과 같은지 확인
        run: git diff --exit-code -- contracts frontend/src/shared/api || (echo "::error::pnpm gen 을 실행하고 결과를 커밋하세요" && exit 1)
